    <!--
      The landing surface, v1. This is NOT the app's entry.

      Deliberately absent, and each for a reason:
        - no manifest and no apple-touch meta: this page is not installable, and
          claiming otherwise would offer to install the marketing page
        - no pre-paint theme/lang boot script: that script exists to stop the
          installed app flashing the wrong theme, and it reads the app's own
          storage keys. This page owns its own ground.
        - no service worker registration: registerSW is called from appMain and
          must stay there. sw.js also skips /home navigations, so visiting this
          page can never overwrite the app's cached shell.

      The version's design lives beside this file. See app/home/README.md for
      the structure and app/home/v1/design.md for the appearance.
    -->

    <title>Wingman - your AI chief of staff on WhatsApp</title>
    <meta
      name="description"
      content="Wingman watches your calendar, inbox and tasks, then tells you what actually matters most, before you even ask. It talks to you on WhatsApp."
    />

    <!-- No canonical, and no og:url or og:image, until the production hostname is
         decided. All three want an ABSOLUTE URL and there is nothing honest to
         hard-code yet.

         It has to be absolute for a second reason: Vite's build-html plugin reads
         every link[href] as an asset to resolve, so a root-relative canonical
         like "/home/v1/" is resolved against the project and fails the build with
         EISDIR when it lands on this directory. An off-origin URL is skipped as
         external, so the real domain will just work. Add all three together. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wingman" />
    <meta property="og:title" content="Wingman - your AI chief of staff on WhatsApp" />
    <meta
      property="og:description"
      content="Wingman watches your calendar, inbox and tasks, then tells you what actually matters most, before you even ask."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Geist for body only. The display face (Freigeist XWide Black) is
         self-hosted and declared in tokens.css, so it is not requested here.

         The product's own Google Sans Flex is absent on purpose: the client lifted
         that constraint, and a UI face does not carry a headline.

         preconnect because the stylesheet and the font files sit on two different
         origins, and the font cannot start downloading until the CSS has landed. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      THE BOOT SCREEN.

      This block is inline, and it is the one piece of this version's appearance
      that does not live in global.css. It has to be: the page is client
      rendered, so between the first paint and the bundle executing there is a
      blank white gap, and anything meant to fill that gap cannot itself be
      waiting on a stylesheet the bundle pulls in. In development Vite injects
      CSS from JavaScript, so on the first frame no token exists at all.

      Which is why every value below is `var(--w1-token, literal)`. tokens.css
      stays the authority the moment it lands; the literal only ever paints the
      handful of frames before it does. It is a stand-in, not a second home for
      a colour. Recorded in design.md under the declared exceptions.

      The sequence is the app's launch splash, transcribed beat for beat: the W
      traces itself, its gradient fill rises under the trace, the star swings in
      and lands, then mark and word travel together into the finished lockup.
      About 2.25s. behaviour.ts then holds the finished lockup for a further
      second before lifting the veil.

      MOTION MAY NEVER STRAND CONTENT, and a veil over the whole page is the
      most direct way to break that rule, so it has two independent ways out:
        - scripting off: the <noscript> block below hides it outright
        - scripting on but broken: w1-boot-bail clears it after eight seconds
      Normally behaviour.ts lifts it long before either fires.
    -->
    <style>
      /* The veil itself. It only ever fades and blurs away; every beat of the
         lockup below is an animation on a child, so the two never contend. */
      .w1-boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: var(--w1-color-paper, #fbfbfd);
        transition:
          opacity var(--w1-dur-very-slow, 520ms) var(--w1-ease-out, cubic-bezier(0.16, 1, 0.3, 1)),
          filter var(--w1-dur-very-slow, 520ms) var(--w1-ease-out, cubic-bezier(0.16, 1, 0.3, 1));
        /* The bail. No effect until it fires: with no `backwards` fill the delay
           is inert, so it cannot fight the transition above. */
        animation: w1-boot-bail 1ms linear 8s forwards;

        /* The app's launch splash, transcribed. These are the --splash-* values
           from app/src/app/app.css, copied rather than imported for the same
           reason the geometry below is copied. They are named here so the
           choreography can be read as beats instead of as loose numbers. */
        --boot-draw: 1050ms;
        --boot-fill: 750ms;
        --boot-fill-delay: 330ms;
        --boot-trace-out: 500ms;
        --boot-trace-out-delay: 1000ms;
        --boot-star: 500ms;
        --boot-star-fade: 250ms;
        --boot-star-delay: 1100ms;
        --boot-star-from: -200deg;
        --boot-star-scale: 0.18;
        /* Not from the app's splash - the star lands there and stays put. Eight
           seconds a revolution, chosen against how long the star is actually on
           screen: it lands at 1600ms and the veil goes at about 3250ms, so the
           reader sees roughly 75 degrees of it. Slower reads as a still image,
           faster reads as a spinner, and it is neither. */
        --boot-turn: 8s;
        --boot-settle: 750ms;
        --boot-settle-delay: 1500ms;
        --boot-word: 600ms;
        --boot-shift: 687px;
        --boot-ease-draw: ease-in-out;
        --boot-ease-star: cubic-bezier(0.34, 1.36, 0.64, 1);
        --boot-ease-settle: cubic-bezier(0.22, 1, 0.36, 1);
      }

      .w1-boot[data-w1-boot='out'] {
        opacity: 0;
        filter: blur(6px);
        pointer-events: none;
      }

      .w1-boot__logo {
        /* Wider than the app's own splash, which is sized for a phone frame. The
           lockup is 2125 units across and only the leading 760 of those are the
           mark, so a cap tuned for 430px reads as a small logo in a browser. */
        width: min(72vw, 420px);
        aspect-ratio: 2125 / 526;
        height: auto;
        display: block;
        /* the trace's round cap sits a hair outside the box while it draws */
        overflow: visible;
        transition: transform var(--w1-dur-very-slow, 520ms)
          var(--w1-ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      }

      .w1-boot[data-w1-boot='out'] .w1-boot__logo {
        transform: scale(1.04);
      }

      /* The word carries the page's ink; the mark keeps its gradient. */
      .w1-boot__word path {
        fill: var(--w1-color-ink, #262930);
      }

      /* ---- the beats ----
         Every one is an animation OFF the finished lockup, so the resting style
         IS the end of the sequence. That is what makes reduced motion a matter of
         switching the animations off rather than describing the artwork twice. */

      /* Mark and word start off to the trailing side and arrive together, so the
         lockup assembles as one object rather than two things meeting. `both`
         holds them out there through the delay the trace draws into. */
      .w1-boot__mark {
        animation: w1-boot-settle var(--boot-settle) var(--boot-ease-settle)
          var(--boot-settle-delay) both;
      }

      .w1-boot__word {
        animation:
          w1-boot-settle var(--boot-settle) var(--boot-ease-settle) var(--boot-settle-delay) both,
          w1-boot-in var(--boot-word) var(--boot-ease-draw) var(--boot-settle-delay) both;
      }

      /* The W's gradient fill: absent at first, up to full under the trace. */
      .w1-boot__wfill {
        animation: w1-boot-in var(--boot-fill) var(--boot-ease-draw) var(--boot-fill-delay) both;
      }

      /* The trace. pathLength=1 in the markup makes the whole path one dash unit,
         so the draw is 1 -> 0 with no measured length to keep in sync. It leaves
         on `reverse`, which is the same fade read backwards. */
      .w1-boot__wtrace {
        stroke-dasharray: 1;
        animation:
          w1-boot-draw var(--boot-draw) var(--boot-ease-draw) both,
          w1-boot-in var(--boot-trace-out) var(--boot-ease-draw) var(--boot-trace-out-delay) reverse
            both;
      }

      /* The star lands once the W is whole, pivoting on itself. */
      .w1-boot__star {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation:
          w1-boot-star var(--boot-star) var(--boot-ease-star) var(--boot-star-delay) both,
          w1-boot-in var(--boot-star-fade) var(--boot-ease-draw) var(--boot-star-delay) both;
      }

      /* ...and then it never stops. The turn picks up exactly where the swing puts
         the star down - the delay is the swing's own delay plus its duration, so
         retiming the landing carries the turn with it rather than leaving a gap or
         an overlap. Linear, because a spin with an ease has a visible seam every
         revolution, and slow enough (one turn a minute is not a spinner; this is
         about one degree every 33ms) that it reads as alive rather than as busy. */
      .w1-boot__spin {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: w1-boot-turn var(--boot-turn) linear
          calc(var(--boot-star-delay) + var(--boot-star)) infinite;
      }

      @keyframes w1-boot-turn {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes w1-boot-settle {
        from {
          transform: translateX(var(--boot-shift));
        }
        to {
          transform: translateX(0);
        }
      }

      @keyframes w1-boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes w1-boot-draw {
        from {
          stroke-dashoffset: 1;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes w1-boot-star {
        from {
          transform: rotate(var(--boot-star-from)) scale(var(--boot-star-scale));
        }
        to {
          transform: rotate(0deg) scale(1);
        }
      }

      @keyframes w1-boot-bail {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* Nothing moves. Switching the animations off lands on the finished lockup,
         because that is the resting state - only the trace needs saying, since
         drawn it sits over the fill in the same gradient and would double it.
         The veil still paints: a loading screen is not itself motion. It is held
         for the same beat and then removed outright instead of easing away. */
      @media (prefers-reduced-motion: reduce) {
        .w1-boot {
          transition: none;
        }
        .w1-boot__logo,
        .w1-boot__mark,
        .w1-boot__word,
        .w1-boot__wfill,
        .w1-boot__wtrace,
        .w1-boot__star,
        .w1-boot__spin {
          animation: none;
          transition: none;
        }
        .w1-boot__wtrace {
          opacity: 0;
        }
      }
    </style>
    <noscript>
      <style>
        .w1-boot {
          display: none;
        }
      </style>
    </noscript>

      The lockup, inline, because it has to be in the document that paints first.

      This is the app's launch splash, transcribed: the same artwork drawing
      itself in the same beats, so opening the site and opening the app begin the
      same way. The geometry is a THIRD copy of the paths - brand.tsx holds the
      second, and it explains why the second exists. This one exists because no
      module has run yet when this has to be on screen. All three move together
      if the brand ever changes.

      The mark is painted three times so each beat can move on its own: the fill
      is the rest look, the trace draws it in over the top, and the star lands
      last. Paint order is the artwork's own - fill, then trace above it so the
      handoff reads, then the star above both.

      Both gradients carry their stop colours as literals rather than tokens, and
      here that is not a fallback but the point: this is the exact failure the
      app's splash hit on a real phone, a black box where the W should be,
      because the mark's paint depended on something landing at runtime. The
      word's ink is a token, so the page reaches it by cascade.

      aria-hidden throughout: this is a loading state, not content, and it is
      gone before there is anything to read.
    -->

    <!-- The page is client-rendered, so this is the whole proposition for a
         reader with no JavaScript, and for anything that does not run it. It is
         real copy, not a placeholder, and it must stay in step with the hero.

         It keeps the FULL positioning line where the fold now shows the shortened
         one, and that is not drift: the two do not contradict, one contains the
         other. This h1 is the only headline a non-JS reader or a crawler that does
         not execute the bundle ever sees, and dropping "on WhatsApp" from it would
         cost them the one word that says where the product lives, to buy a display
         decision they are not looking at. Same reasoning as the <title> above. -->
    <noscript>
      <h1>Your AI chief of staff on WhatsApp</h1>
      <p>
        Wingman keeps an eye on your calendar, inbox and tasks, then tells you what actually matters
        most, before you even ask. No new inbox to check: your briefings, alerts and answers arrive
        in the chat you already open every day.
      </p>
      <p>This page needs JavaScript for the rest. Wingman itself does not.</p>
