<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="robots" content="noindex" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <!-- Same body font the landing uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" />

    <style>
      /* The landing's own display face — same file the marketing site serves. */
      @font-face {
        font-family: "Freigeist XWide";
        src: url("/assets/freigeist-xwide-black-DnD2Sy2P.woff2") format("woff2"),
             url("/assets/freigeist-xwide-black-DHacDt-Q.woff") format("woff");
        font-weight: 900; font-style: normal; font-display: swap;
      }

      /* Exact tokens copied from the landing (home-v1) so this matches 1:1. */
      :root {
        --paper: oklch(99% 0.003 259);
        --ink: oklch(21% 0.012 259);
        --muted: oklch(52% 0.011 259);
        --rule: oklch(89% 0.006 259);
        --accent: oklch(55.6% 0.158 265);
        --accent-deep: oklch(48% 0.15 265);
        --accent-ink: oklch(99% 0.003 259);
        --brand-from: oklch(78% 0.055 340);
        --brand-to: oklch(60% 0.145 262);
        --grid: oklch(21% 0.012 259 / 0.05);
        --font-display: "Freigeist XWide", "Arial Black", system-ui, sans-serif;
        --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: var(--font-body);
        color: var(--ink);
        background-color: var(--paper);
        background-image:
          radial-gradient(1100px 620px at 50% -8%, oklch(55.6% 0.158 265 / 0.10), transparent 62%),
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: auto, 64px 64px, 64px 64px;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      canvas#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }

      .card {
        position: relative; z-index: 10;
        width: 100%; max-width: 560px;
        background: oklch(100% 0 0 / 0.72);
        backdrop-filter: blur(6px);
        border: 1px solid var(--rule);
        border-radius: 26px;
        padding: 52px 44px;
        text-align: center;
        box-shadow: 0 30px 70px -28px oklch(21% 0.012 259 / 0.28);
        animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: none; } }

      .brand { display: block; width: 52px; height: 52px; margin: 0 auto 26px; border-radius: 14px; }

      h1 {
        font-family: var(--font-display);
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.005em;
        line-height: 0.98;
        font-size: clamp(2rem, 5.2vw + 0.4rem, 3.4rem);
        margin: 0 0 16px;
      }
      p.sub {
        color: var(--muted);
        font-size: 1.0625rem; line-height: 1.55;
        margin: 0 auto 30px; max-width: 420px;
      }

      .btn {
        display: inline-flex; align-items: center; justify-content: center;
        text-decoration: none;
        background: var(--accent); color: var(--accent-ink);
        font-family: var(--font-body); font-weight: 500; font-size: 1.0625rem;
        padding: 15px 34px; border-radius: 999px;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn:hover { transform: scale(1.03); background: var(--accent-deep); }

      .count { margin-top: 24px; font-size: 0.875rem; color: var(--muted); }
      .count b { color: var(--ink); font-weight: 600; }

      @media (max-width: 480px) { .card { padding: 40px 24px; } }
    </style>
  </head>
  <body>
    <canvas id="confetti"></canvas>

    <main class="card">
      <img class="brand" src="/icon.svg" alt="Wingman" />

      <h1>You're on the list! 🎉</h1>
      <p class="sub">
        Thank you for joining the Wingman waitlist. We'll reach out the moment it
        opens up — one message when there's something real to try, and nothing else.
      </p>

      <a class="btn" href="/">Back to home</a>

      <div class="count">Taking you home in <b><span id="secs">5</span></b> seconds…</div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
      (function () {
        try {
          if (window.confetti) {
            var c = window.confetti.create(document.getElementById('confetti'), { resize: true, useWorker: true });
            // Brand-matched confetti (accent blue, brand lavender/pink, neutrals).
            var colors = ['#4f46e5', '#6366f1', '#c4b5fd', '#f0abfc', '#22c55e', '#ffffff'];
            c({ particleCount: 150, spread: 78, origin: { y: 0.62 }, colors: colors });
            setTimeout(function () { c({ particleCount: 80, angle: 60, spread: 62, origin: { x: 0 }, colors: colors }); }, 240);
            setTimeout(function () { c({ particleCount: 80, angle: 120, spread: 62, origin: { x: 1 }, colors: colors }); }, 400);
          }
        } catch (e) {}

        var n = 5;
        var el = document.getElementById('secs');
        var t = setInterval(function () {
          n -= 1;
          if (el) el.textContent = String(Math.max(0, n));
          if (n <= 0) { clearInterval(t); window.location.assign('/'); }
        }, 1000);
      })();
    </script>
  </body>
</html>
