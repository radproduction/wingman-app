<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wingman" />
    <script>
      ;(function () {
        try {
          var agent = JSON.parse(localStorage.getItem('wingman.agent') || '{}')
          var lang = agent.language || 'en'
          document.documentElement.setAttribute('lang', lang)
          document.documentElement.setAttribute('dir', lang === 'ar' || lang === 'ur' ? 'rtl' : 'ltr')
        } catch (e) {
        }
        try {
          var saved = JSON.parse(localStorage.getItem('wingman.prefs') || '{}')
          var theme =
            saved.theme === 'light' || saved.theme === 'dark'
              ? saved.theme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          var top = theme === 'dark' ? '#131313' : '#ffffff'
          var root = document.documentElement
          root.setAttribute('data-theme', theme)
          root.style.backgroundColor = top
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', top)
        } catch (e) {
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    />

    <title>Wingman</title>

  </head>

    <div id="root"></div>
  </body>
</html>
